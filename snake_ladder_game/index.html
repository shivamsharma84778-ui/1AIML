<!DOCTYPE html>
<html lang="en">
<head>
  <title>Snake and Ladder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(10, 45px);
      width: 450px;
      margin: 20px auto;
      border: 2px solid #333;
    }
    .cell {
      width: 45px;
      height: 45px;
      border: 1px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-sizing: border-box;
    }
    .p1 { background-color: #4d96ff; color: white; font-weight: bold; }
    .p2 { background-color: #ff6b6b; color: white; font-weight: bold; }
    .both { background-color: #9b59b6; color: white; font-weight: bold; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Snake & Ladder Game</h2>
  <p id="status">Player 1's Turn | P1: 0 | P2: 0</p>
  <button onclick="rollDice()">Roll Dice</button>
  <div id="board"></div>

  <script>
    let pos1 = 0;
    let pos2 = 0;
    let turn = 1;

    const snakes = { 98: 40, 87: 24, 62: 18, 49: 11 };
    const ladders = { 4: 25, 13: 46, 33: 72, 50: 89 };

    function drawBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      for (let i = 100; i >= 1; i--) {
        let cell = document.createElement("div");
        cell.className = "cell";
        cell.innerText = i;

        if (snakes[i]) cell.innerText += "\n🐍";
        if (ladders[i]) cell.innerText += "\n🪜";

        if (pos1 === i && pos2 === i) cell.classList.add("both");
        else if (pos1 === i) cell.classList.add("p1");
        else if (pos2 === i) cell.classList.add("p2");

        board.appendChild(cell);
      }
    }

    function rollDice() {
      let dice = Math.floor(Math.random() * 6) + 1;
      let msg = `Player ${turn} rolled a ${dice}. `;

      if (turn === 1) {
        if (pos1 + dice <= 100) pos1 += dice;
        if (snakes[pos1]) { msg += "Bitten by snake! "; pos1 = snakes[pos1]; }
        if (ladders[pos1]) { msg += "Climbed a ladder! "; pos1 = ladders[pos1]; }
        if (pos1 === 100) {
          drawBoard();
          alert("Player 1 Wins!");
          resetGame();
          return;
        }
        turn = 2;
      } else {
        if (pos2 + dice <= 100) pos2 += dice;
        if (snakes[pos2]) { msg += "Bitten by snake! "; pos2 = snakes[pos2]; }
        if (ladders[pos2]) { msg += "Climbed a ladder! "; pos2 = ladders[pos2]; }
        if (pos2 === 100) {
          drawBoard();
          alert("Player 2 Wins!");
          resetGame();
          return;
        }
        turn = 1;
      }

      document.getElementById("status").innerText =
        `${msg} Next: Player ${turn} | P1: ${pos1} | P2: ${pos2}`;
      drawBoard();
    }

    function resetGame() {
      pos1 = 0;
      pos2 = 0;
      turn = 1;
      document.getElementById("status").innerText = "Player 1's Turn | P1: 0 | P2: 0";
      drawBoard();
    }

    drawBoard();
  </script>
</body>
</html>
