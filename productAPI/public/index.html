<!DOCTYPE html>
<html lang="en">
<head>
  <title>Products CSR</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; }
    .card { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px; }
    input { padding: 6px; margin: 4px; }
  </style>
</head>
<body>
  <h2>Add New Product</h2>
  <form id="productForm">
    <input type="text" id="name" placeholder="Product Name" required>
    <input type="number" id="price" placeholder="Price (₹)" required>
    <input type="number" step="0.1" id="rating" placeholder="Rating (1-5)" required>
    <button type="submit">Add Product</button>
  </form>

  <h2>All Products</h2>
  <div id="productList"></div>

  <script>
    async function loadProducts() {
      let res = await fetch("/api/products");
      let products = await res.json();
      let list = document.getElementById("productList");
      list.innerHTML = "";

      products.forEach(p => {
        list.innerHTML += `
          <div class="card">
            <h4>${p.name} (ID: ${p.id})</h4>
            <p>Price: ₹${p.price} | Rating: ${p.rating} ⭐</p>
          </div>
        `;
      });
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      let data = {
        name: document.getElementById("name").value,
        price: document.getElementById("price").value,
        rating: document.getElementById("rating").value
      };

      await fetch("/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      e.target.reset();
      loadProducts();
    });

    loadProducts();
  </script>
</body>
</html>
